name: Foliq Windows test package
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install_deps_windows
        with:
          msystem: ucrt64
          msys_package_env: ucrt-x86_64
          gtk_compatibility_downgrade: 'false'
      - uses: ./.github/actions/build
        with:
          build_type: RelWithDebInfo
          shell: msys2 {0}
          cmake_flags: -DFOLIQ_BUILD=ON -DENABLE_GTEST=ON -DDOWNLOAD_GTEST=ON
      - name: Build and run upstream tests
        run: |
          set -euo pipefail
          cmake --build build --target test-units
          CI=true build/test/test-units.exe --gtest_output=xml:build/test-results.xml
      - name: Package using upstream Windows procedure
        run: |
          set -euo pipefail
          cd build
          INSTALLER_NAME=foliq-setup.exe NSI_SCRIPT=foliq.nsi APP_ICON="$PWD/src/win32/xournalpp.ico" \
            bash ../windows-setup/package.sh
          test -s foliq-setup.exe
          test -s dist/bin/xournalpp.exe
          ./dist/bin/xournalpp.exe --version
          mkdir -p dist/share/foliq/legal dist/share/foliq/build
          cp ../LICENSE ../AUTHORS ../copyright.txt dist/share/foliq/legal/
          cp -r ../docs/licenses dist/share/foliq/legal/project-licenses
          cp ../docs/UPSTREAM.md ../docs/WINDOWS.md dist/share/foliq/
          cp -r /ucrt64/share/licenses dist/share/foliq/legal/dependencies
          pacman -Q > dist/share/foliq/build/msys2-packages.txt
          cmake --version > dist/share/foliq/build/toolchain.txt
          g++ --version >> dist/share/foliq/build/toolchain.txt
          git rev-parse HEAD > dist/share/foliq/build/source-commit.txt
          cp CMakeCache.txt dist/share/foliq/build/
          # git archive applies the current directory prefix: run from the repository root.
          git -C .. archive --format=tar.gz HEAD > foliq-source.tar.gz
          tar -xOf foliq-source.tar.gz src/core/folio/Catalog.cpp > /dev/null
          tar -xOf foliq-source.tar.gz src/core/control/jobs/SaveJob.cpp > /dev/null
          tar -xOf foliq-source.tar.gz LICENSE > /dev/null
          powershell -NoProfile -Command "Compress-Archive -Path dist\\* -DestinationPath foliq-windows-x64-portable.zip"
          sha256sum foliq-setup.exe foliq-windows-x64-portable.zip dist/bin/xournalpp.exe foliq-source.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: foliq-windows-x64-test
          path: |
            build/foliq-setup.exe
            build/foliq-windows-x64-portable.zip
            build/foliq-source.tar.gz
            build/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foliq-windows-diagnostics
          path: |
            build/test-results.xml
            build/CMakeCache.txt
            build/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: warn

  # Tag v* -> GitHub release with installer, portable ZIP, matching source and checksums.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: foliq-windows-x64-test
          path: release
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd release
          cat > notes.md <<'NOTES'
          Foliq Entwicklungs-Release für Windows 10/11 (x64).

          - **foliq-setup.exe**: Installer (Startmenü „Foliq“, Deinstallation über Windows-Einstellungen).
            Wird neben einem vorhandenen Xournal++ installiert und entfernt es nicht.
          - **foliq-windows-x64-portable.zip**: ohne Installation, `bin/xournalpp.exe` starten.
          - **foliq-source.tar.gz**: vollständiger Quellcode dieses Builds (GPL-2.0-or-later).
          - **SHA256SUMS**: Prüfsummen.

          Basiert auf Xournal++ (© The Xournal++ Team und Mitwirkende). Lizenz- und
          Abhängigkeitshinweise liegen im Paket unter `share/foliq/legal`.
          Der Installer ist nicht signiert; Windows SmartScreen kann warnen
          („Weitere Informationen“ → „Trotzdem ausführen“).
          Vorabversion: Stift-, Touch- und DPI-Abnahme unter Windows steht noch aus.
          NOTES
          sed -i 's/^          //' notes.md
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --prerelease \
            --title "Foliq ${GITHUB_REF_NAME#v}" --notes-file notes.md \
            foliq-setup.exe foliq-windows-x64-portable.zip foliq-source.tar.gz SHA256SUMS
